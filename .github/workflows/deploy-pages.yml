name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyBz25J-U_OsBNHecxZCqPmu49-Ap6b3KcM"
          VITE_FIREBASE_AUTH_DOMAIN: "ulunavir-wiki.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "ulunavir-wiki"
          VITE_FIREBASE_STORAGE_BUCKET: "ulunavir-wiki.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "675177665887"
          VITE_FIREBASE_APP_ID: "1:675177665887:web:1de272741f1baa304b12ea"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
